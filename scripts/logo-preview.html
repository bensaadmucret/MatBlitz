<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MatBlitz Logo Preview</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #1e1b4b;
    }
    .logo-container {
      text-align: center;
    }
    svg {
      width: 512px;
      height: 512px;
    }
    .info {
      color: #fbbf24;
      font-family: sans-serif;
      margin-top: 20px;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #fbbf24;
      color: #1e1b4b;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      <defs>
        <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#f59e0b"/>
          <stop offset="50%" style="stop-color:#fbbf24"/>
          <stop offset="100%" style="stop-color:#f59e0b"/>
        </linearGradient>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#1e1b4b"/>
          <stop offset="100%" style="stop-color:#312e81"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="4" dy="4" stdDeviation="8" flood-opacity="0.3"/>
        </filter>
      </defs>
      
      <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
      <circle cx="256" cy="256" r="240" fill="none" stroke="#fbbf24" stroke-width="8"/>
      
      <g transform="translate(256, 256)" filter="url(#shadow)">
        <path d="M -20 -80 L 40 -10 L 0 -10 L 30 80 L -50 0 L -10 0 Z" 
              fill="url(#boltGradient)" stroke="#fff" stroke-width="3"/>
        <circle cx="0" cy="0" r="120" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
        <circle cx="0" cy="0" r="100" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>
      </g>
      
      <g fill="#fbbf24" opacity="0.6">
        <circle cx="100" cy="120" r="4"/>
        <circle cx="420" cy="150" r="3"/>
        <circle cx="400" cy="380" r="5"/>
        <circle cx="80" cy="350" r="3"/>
        <circle cx="180" cy="80" r="2"/>
        <circle cx="350" cy="100" r="2"/>
      </g>
    </svg>
    
    <div class="info">
      <h2>🎨 Logo MatBlitz</h2>
      <p>512 x 512 px</p>
    </div>
    
    <button onclick="downloadPNG()">📥 Télécharger PNG</button>
  </div>

  <script>
    function downloadPNG() {
      const svg = document.querySelector('svg');
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      
      const img = new Image();
      const svgData = new XMLSerializer().serializeToString(svg);
      img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        const link = document.createElement('a');
        link.download = 'icon.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
    }
  </script>
</body>
</html>
